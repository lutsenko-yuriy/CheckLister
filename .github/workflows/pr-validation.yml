name: PR validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'android/**'
              - 'package.json'
              - 'package-lock.json'
              - 'App.tsx'
              - 'index.js'
              - 'patches/**'
              - '.github/workflows/pr-validation.yml'

  checks:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Script contract tests
        run: python3 -m unittest discover -s scripts/tests

  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-build:
    name: iOS simulator build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CheckLister
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}-
            deriveddata-${{ runner.os }}-

      - name: Build for iOS Simulator (unsigned, compile-check only)
        run: |
          xcodebuild -workspace ios/CheckLister.xcworkspace -scheme CheckLister \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/CheckLister \
            CODE_SIGNING_ALLOWED=NO build
