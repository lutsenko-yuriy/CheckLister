name: Tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  onboard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run onboard tests
        run: python -W error -m unittest discover -s scripts/onboard/tests -t .

  skill_router:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run skill_router tests
        run: python -W error -m unittest discover -s scripts/skill_router/tests -t scripts

  notes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run notes tests
        run: python -W error -m unittest discover -s scripts/notes/tests -t .

  checkup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The tests import `checkup.due`, so the top level must be scripts/ (`-t .` fails).
      - name: Run checkup tests
        run: python -W error -m unittest discover -s scripts/checkup/tests -t scripts

  demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qrencode
        run: sudo apt-get install -y qrencode
      - name: Run demo tests
        run: python -W error -m unittest discover -s scripts/demo/tests -t .
