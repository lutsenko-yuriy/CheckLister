appId: ${APP_ID}
name: Run history entry points follow the scenario kill-switch
tags:
  - ios
  - android
---
# CheL-147: needs a scenario build (checklister://scenarios/... links).
- runFlow: helpers/create-checklist.yaml
- tapOn: Start run
- tapOn: .*Scenario first.*
- tapOn: .*Scenario second.*
- tapOn: Complete the checklist
- assertVisible: Run history
- tapOn: Back
- assertVisible:
    id: home-run-history-row
- openLink: 'checklister://scenarios/kill-switch?id=runHistory&enabled=false'
- tapOn:
    text: Open
    optional: true
# The default-on state can show for a moment before the pushed value lands.
- extendedWaitUntil:
    notVisible:
      id: home-run-history-row
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ${output.title}.*
    direction: DOWN
- tapOn: ${output.title}.*
- assertVisible: Start run
- assertNotVisible: Run history
- openLink: 'checklister://scenarios/kill-switch?id=runHistory&enabled=true'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Run history
    timeout: 10000
- tapOn: Back
- assertVisible:
    id: home-run-history-row
- tapOn: Run history
- assertVisible: ${output.title}
- tapOn: Back
- scrollUntilVisible:
    element:
      text: ${output.title}.*
    direction: DOWN
- tapOn: ${output.title}.*
- openLink: 'checklister://scenarios/kill-switch/reset'
- tapOn:
    text: Open
    optional: true
- assertVisible: Run history
- runFlow: helpers/delete-checklist.yaml
