appId: org.reactjs.native.example.CheckLister
name: Foreground select delivers a failure when the callback can't be opened
---
- runFlow: helpers/create-checklist.yaml
- tapOn: Back
- assertVisible: New checklist title
- openLink: "checklister://select?callbackUrl=missingcaller%3A%2F%2Fresult"
- tapOn:
    text: Open
    optional: true
- assertVisible: Select checklist
- tapOn: ${output.title}.*
- assertVisible: Could not return the result to the calling app\.
- tapOn: OK
- assertVisible: New checklist title
- scrollUntilVisible:
    element:
      text: ${output.title}.*
    direction: DOWN
- tapOn:
    id: delete-checklist-${output.title}
- assertVisible: Delete checklist\?
- tapOn:
    text: Delete
    childOf:
      containsChild:
        text: Cancel
- assertNotVisible: ${output.title}.*
