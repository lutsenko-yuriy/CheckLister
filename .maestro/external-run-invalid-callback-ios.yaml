appId: org.reactjs.native.example.CheckLister
name: Cold external-run link rejects an invalid callback
---
- stopApp
- openLink: 'checklister://run?checklistId=missing&callbackUrl=not-a-url'
- tapOn:
    text: Open
    optional: true
- assertVisible: We do not know which app to return to\.
- tapOn: OK
- assertVisible: New checklist title
