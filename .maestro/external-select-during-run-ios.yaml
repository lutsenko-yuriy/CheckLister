appId: org.reactjs.native.example.CheckLister
name: A select request during an active run leaves the run untouched
---
- runFlow: helpers/create-checklist.yaml
- tapOn: Start run
- tapOn: .*Scenario first.*
- assertVisible: 1 of 2 checked
- openLink: 'checklister://select?callbackUrl=missingcaller%3A%2F%2Fresult'
- tapOn:
    text: Open
    optional: true
- assertVisible: Select checklist
- tapOn: Cancel
- tapOn:
    text: OK
    optional: true
- assertVisible: 1 of 2 checked
- runFlow: helpers/discard-run.yaml
- runFlow: helpers/delete-checklist.yaml
