appId: ${APP_ID}
name: Consent dialog is required, cannot be dismissed, and the choice is remembered
tags:
  - ios
  - android
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Help improve CheckLister\?
    timeout: 20000
- assertVisible: Share anonymous usage data.*
- assertVisible: Don't allow
- assertVisible: Allow
# A tap on the scrim, outside the card, must not close the dialog.
- tapOn:
    point: 50%,4%
- assertVisible: Help improve CheckLister\?
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
      - assertVisible: Help improve CheckLister\?
- tapOn: Don't allow
- assertNotVisible: Help improve CheckLister\?
- assertVisible: New checklist title
# "Don't allow" leaves the app fully usable.
- runFlow: helpers/create-checklist.yaml
- runFlow: helpers/delete-checklist.yaml
# The choice is remembered across a relaunch.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: New checklist title
    timeout: 20000
- assertNotVisible: Help improve CheckLister\?
# Never tap "Allow": test devices must not send data to the Firebase project.
