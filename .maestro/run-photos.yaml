appId: ${APP_ID}
name: Photos can be attached, viewed, removed and kept after completion
tags:
  - ios
  - android
---
# CheL-161: needs a scenario build (checklister://scenarios/... links).
- launchApp:
    clearState: true
- runFlow: helpers/answer-analytics-consent.yaml
# Photo analytics only reach the events screen while consent is granted.
- tapOn:
    id: open-settings
- tapOn:
    id: analytics-consent-switch
- assertVisible:
    id: analytics-consent-switch
    checked: true
- tapOn: Back
- runFlow: helpers/create-checklist.yaml
- tapOn: Start run
- openLink: 'checklister://scenarios/photo-picker?result=picked'
- tapOn:
    text: Open
    optional: true
# An item photo: the + becomes a thumbnail and the item is not toggled.
- tapOn: Add photo to Scenario first
- tapOn: Choose from library
- extendedWaitUntil:
    visible: Open photo
    timeout: 10000
- assertNotVisible: Add photo to Scenario first
- assertVisible: 0 of 2 checked
# Two run photos: the + stays at the end of the row.
- tapOn: Add photo to this run
- tapOn: Take photo
- extendedWaitUntil:
    visible:
      id: photo-thumbnail-.*
      index: 1
    timeout: 10000
- tapOn: Add photo to this run
- tapOn: Choose from library
- assertVisible:
    id: add-run-photo
# The viewer: Remove asks first, Cancel keeps the photo.
- tapOn:
    text: Open photo
    index: 0
- assertVisible: Close
- tapOn: Remove
- assertVisible: Remove photo\?
- tapOn: Cancel
- assertVisible: Close
- tapOn: Remove
- tapOn:
    text: Remove
    childOf:
      containsChild:
        text: Cancel
- assertNotVisible: Close
- assertVisible: Add photo to Scenario first
# TODO(WU4): after completing, open Run history, then the entry — both items checked, the run photos shown
# TODO(WU4): open a photo there — the viewer has no Remove
- tapOn: .*Scenario first.*
- tapOn: .*Scenario second.*
- tapOn: Complete the checklist
- assertVisible: Start run
- openLink: 'checklister://scenarios/analytics'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 'photo_attached \(checklist_id: .*'
    timeout: 10000
- assertVisible: 'photo_removed \(checklist_id: .*, target: item\)'
- assertVisible: 'run_completed \(checklist_id: .*, item_count: 2, photo_count: 2\)'
- tapOn: Back
- runFlow: helpers/delete-checklist.yaml
