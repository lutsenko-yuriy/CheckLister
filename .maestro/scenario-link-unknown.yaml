appId: ${APP_ID}
name: Malformed scenario links show an alert and change nothing
tags:
  - ios
  - android
---
# CheL-147: needs a scenario build (checklister://scenarios/... links).
- runFlow: helpers/create-checklist.yaml
- tapOn: Start run
- tapOn: Scenario first
- tapOn: Scenario second
- tapOn: Complete the checklist
- tapOn: Back
- assertVisible:
    id: home-run-history-row
- openLink: 'checklister://scenarios/kill-switch?id=nope&enabled=false'
- tapOn:
    text: Open
    optional: true
- assertVisible: Unknown scenario command
- tapOn: OK
- assertVisible:
    id: home-run-history-row
- openLink: 'checklister://scenarios/kill-switch?id=runHistory&enabled=maybe'
- tapOn:
    text: Open
    optional: true
- assertVisible: Unknown scenario command
- tapOn: OK
- assertVisible:
    id: home-run-history-row
- scrollUntilVisible:
    element:
      text: ${output.title}.*
    direction: DOWN
- tapOn: ${output.title}.*
- runFlow: helpers/delete-checklist.yaml
