appId: ${APP_ID}
name: Analytics events are recorded only while consent is granted
tags:
  - ios
  - android
---
# CheL-147: needs a scenario build (recording analytics stub + events screen).
# Nothing is sent to Firebase: the stub records what the consent gate lets through.
- launchApp:
    clearState: true
- runFlow: helpers/answer-analytics-consent.yaml
- openLink: 'checklister://scenarios/analytics/clear'
- tapOn:
    text: Open
    optional: true
# Consent was declined, so the gate drops everything this creates (item_added, screen views).
- runFlow: helpers/create-checklist.yaml
- openLink: 'checklister://scenarios/analytics'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 0 recorded
    timeout: 10000
- tapOn: Back
# Switching analytics on from Settings records the consent event.
- tapOn: Back
- tapOn:
    id: open-settings
- tapOn:
    id: analytics-consent-switch
- assertVisible:
    id: analytics-consent-switch
    checked: true
- openLink: 'checklister://scenarios/analytics'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: analytics_consent_granted
    timeout: 10000
- tapOn: Back
# With consent granted, opening the checklist and adding an item is recorded.
- tapOn: Back
- openLink: 'checklister://scenarios/analytics/clear'
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      text: ${output.title}.*
    direction: DOWN
- tapOn: ${output.title}.*
- tapOn: New item
- inputText: Scenario third
- pressKey: Enter
- openLink: 'checklister://scenarios/analytics'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 'screen_checklist_detail \(item_count: 2\)'
    timeout: 10000
- assertVisible: 'item_added \(checklist_id: .*, item_count: 3\)'
- tapOn: Back
# Switching it off drops everything again.
- tapOn: Back
- tapOn:
    id: open-settings
- tapOn:
    id: analytics-consent-switch
- assertVisible:
    id: analytics-consent-switch
    checked: false
- openLink: 'checklister://scenarios/analytics/clear'
- tapOn:
    text: Open
    optional: true
- tapOn: Back
- scrollUntilVisible:
    element:
      text: ${output.title}.*
    direction: DOWN
- tapOn: ${output.title}.*
- tapOn: New item
- inputText: Scenario fourth
- pressKey: Enter
- openLink: 'checklister://scenarios/analytics'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 0 recorded
    timeout: 10000
- tapOn: Back
# The stub lives in memory only: a relaunch starts from zero records.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: New checklist title
    timeout: 20000
- openLink: 'checklister://scenarios/analytics'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 0 recorded
    timeout: 10000
- tapOn: Back
- scrollUntilVisible:
    element:
      text: ${output.title}.*
    direction: DOWN
- tapOn: ${output.title}.*
- runFlow: helpers/delete-checklist.yaml
