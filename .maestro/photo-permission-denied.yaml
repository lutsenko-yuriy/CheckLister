appId: ${APP_ID}
name: Denied photo access shows an explanation
tags:
  - ios
  - android
---
# CheL-161: needs a scenario build (checklister://scenarios/... links).
- launchApp:
    clearState: true
- runFlow: helpers/answer-analytics-consent.yaml
# Photo analytics only reach the events screen while consent is granted.
- tapOn:
    id: open-settings
- tapOn:
    id: analytics-consent-switch
- assertVisible:
    id: analytics-consent-switch
    checked: true
- tapOn: Back
- runFlow: helpers/create-checklist.yaml
- tapOn: Start run
- openLink: 'checklister://scenarios/photo-picker?result=denied'
- tapOn:
    text: Open
    optional: true
- tapOn: Add photo to Scenario first
- assertVisible: Add photo
- tapOn: Take photo
- assertVisible: Photo access is off
- assertVisible: Open Settings
- tapOn: Cancel
- assertVisible: Add photo to Scenario first
- openLink: 'checklister://scenarios/photo-picker?result=cancelled'
- tapOn:
    text: Open
    optional: true
- tapOn: Add photo to Scenario first
- tapOn: Take photo
- assertNotVisible: Photo access is off
- assertVisible: Add photo to Scenario first
- openLink: 'checklister://scenarios/analytics'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 'photo_permission_denied \(source: camera\)'
    timeout: 10000
- tapOn: Back
- runFlow: helpers/discard-run.yaml
- runFlow: helpers/delete-checklist.yaml
