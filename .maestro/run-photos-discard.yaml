appId: ${APP_ID}
name: Discarding a run deletes its photos
tags:
  - ios
  - android
---
# CheL-161: needs a scenario build (checklister://scenarios/... links).
- launchApp:
    clearState: true
- runFlow: helpers/answer-analytics-consent.yaml
- runFlow: helpers/create-checklist.yaml
- tapOn: Start run
- openLink: 'checklister://scenarios/photo-picker?result=picked'
- tapOn:
    text: Open
    optional: true
- tapOn: Add photo to Scenario first
- tapOn: Choose from library
- extendedWaitUntil:
    visible: Open photo
    timeout: 10000
- tapOn: Add photo to this run
- tapOn: Take photo
- extendedWaitUntil:
    visible:
      id: photo-thumbnail-.*
      index: 1
    timeout: 10000
- runFlow: helpers/discard-run.yaml
- tapOn: Start run
- assertVisible: 0 of 2 checked
- assertNotVisible: Open photo
- assertVisible: Add photo to Scenario first
- runFlow: helpers/discard-run.yaml
# The discarded run left no history entry.
- assertNotVisible: Run history
- runFlow: helpers/delete-checklist.yaml
