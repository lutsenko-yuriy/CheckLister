appId: ${APP_ID}
---
# Terminates and relaunches without clearing app data, then reopens
# ${output.title}. Scrolls/taps by id (checklist-row-<title>), not text:
# iOS merges the row's title/item-count Text children into one accessible
# node, and matching that merged label by text is unreliable specifically
# after a cold relaunch (confirmed empirically — a bare id selector on the
# same row works immediately, text never resolves even after 20s waits).
- stopApp
- launchApp:
    clearState: false
# CheL-110: same cold-start timing-margin race as helpers/create-checklist.yaml
# — see that file's comment for the probe data behind the 20000ms timeout
# and why extendedWaitUntil (not assertVisible, which has no timeout field)
# is used here.
- extendedWaitUntil:
    visible: New checklist title
    timeout: 20000
- scrollUntilVisible:
    element:
      id: checklist-row-${output.title}
    direction: DOWN
- tapOn:
    id: checklist-row-${output.title}
