appId: ${APP_ID}
---
# CheL-126: launches the app without clearing data and answers the analytics
# consent dialog with "Don't allow" when it shows, so every flow reaches the
# home screen. Never taps "Allow": test devices must not send data to Firebase.
- launchApp:
    clearState: false
# CheL-110: Android cold-start latency exceeds assertVisible's 7s default.
- extendedWaitUntil:
    visible: 'New checklist title|Help improve CheckLister\?'
    timeout: 20000
- runFlow:
    when:
      visible: 'Help improve CheckLister\?'
    commands:
      - tapOn: Don't allow
- assertVisible: New checklist title
