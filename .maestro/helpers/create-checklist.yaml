appId: ${APP_ID}
---
- evalScript: ${output.title = 'Scenario ' + Date.now() + '-' + Math.floor(Math.random() * 1000000)}
- launchApp:
    clearState: false
- assertVisible: New checklist title
- tapOn: New checklist title
- inputText: ${output.title}
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: ${output.title}
    direction: DOWN
- tapOn: ${output.title}
- assertVisible:
    text: Start run
    enabled: false
- tapOn: New item
- inputText: Scenario first
- pressKey: Enter
- tapOn: New item
- inputText: Scenario second
- pressKey: Enter
- assertVisible:
    text: Start run
    enabled: true
