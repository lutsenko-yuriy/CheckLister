appId: ${APP_ID}
---
- evalScript: ${output.title = 'Scenario ' + Date.now() + '-' + Math.floor(Math.random() * 1000000)}
- launchApp:
    clearState: false
# CheL-110: Android cold-start latency (up to ~16s tail) exceeds Maestro's
# 7s assertVisible default; extendedWaitUntil covers it. See docs/knowledge/notes/110.md.
- extendedWaitUntil:
    visible: New checklist title
    timeout: 20000
- tapOn: New checklist title
- inputText: ${output.title}
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: ${output.title}
    direction: DOWN
- tapOn: ${output.title}
- assertVisible:
    text: Start run
    enabled: false
- tapOn: New item
- inputText: Scenario first
- pressKey: Enter
- tapOn: New item
- inputText: Scenario second
- pressKey: Enter
- assertVisible:
    text: Start run
    enabled: true
