appId: ${APP_ID}
name: Settings opens from the home gear, shows analytics off, and the choice survives a relaunch
tags:
  - ios
  - android
---
# CheL-127. Never switches analytics on; toggling it and the events it records are
# covered by analytics-events.yaml (scenario build) and Jest.
- runFlow: helpers/answer-analytics-consent.yaml
- assertVisible:
    id: open-settings
# CheL-128: the debug icon exists in debug builds only; this suite installs Release.
- assertNotVisible:
    id: open-debug
- tapOn:
    id: open-settings
- assertVisible: Settings
- assertVisible: Share anonymous usage data
- assertVisible:
    id: analytics-consent-switch
    checked: false
- tapOn: Back
- assertVisible: New checklist title
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: New checklist title
    timeout: 20000
- tapOn:
    id: open-settings
- assertVisible:
    id: analytics-consent-switch
    checked: false
- tapOn: Back
