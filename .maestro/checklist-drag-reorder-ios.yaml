appId: ${APP_ID}
name: Drag-to-reorder checklist items and use the order in a run
tags:
  - ios
---
- runFlow: helpers/create-checklist.yaml
- tapOn: New item
- inputText: Scenario third
- pressKey: Enter
# Initial order: first, second, third.
- assertVisible:
    text: '.*Scenario second.*'
    below:
      text: '.*Scenario first.*'
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
# Drag "first" downward past "second" and "third", landing in "third"'s slot.
# Expected order: second, third, first. A short/default-duration swipe never
# triggers the real drag gesture here: react-native-reanimated-dnd's pan
# gesture uses activateAfterLongPress(200), and a fast synthetic swipe moves
# too much before that timer elapses for it to activate at all (confirmed:
# 1.5s duration produced zero movement). A slow swipe keeps the initial
# movement small enough to activate, then completes the drag. CheL-98:
# even with correctly-landing coordinates this still raced the timer
# intermittently at 4000/8000ms (Maestro reports the swipe COMPLETED but
# the app shows zero movement) — 12000ms cleared this in on-device
# validation (multiple consecutive runs on an iPhone 17 and an iPhone 17
# Pro simulator). CheL-105 WU2 re-probed after CheL-98's coordinate fix
# landed: 10000/9000/8000ms all cleared 10/10 consecutive runs on the same
# devices; 4000ms failed 9/10 (the coordinate fix removed the *positional*
# miss but not the activateAfterLongPress(200) race itself). 8000ms is a
# 4000ms margin above that failure — well past the 1000ms floor — and
# saves 4s per swipe over the old 12000ms value.
- swipe:
    start: 7%,35%
    end: 7%,69%
    duration: 8000
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
- assertVisible:
    text: '.*Scenario first.*'
    below:
      text: '.*Scenario third.*'
# Drag "first" (now at the bottom) upward back to the top, restoring the
# original order: first, second, third. CheL-98: the start point must land
# on the item's drag-handle testID — at 48% this silently missed it by
# ~7.5pt on a 402x874pt screen (handle top edge measured via the
# screen-hierarchy debug artifact at y=427, vs. 48%'s y=419.5), so Maestro
# reported the swipe as completed while the app saw no touch on the handle
# at all and nothing moved. 50% (integer — Maestro's percentage
# coordinates don't accept decimals) lands on the handle's measured
# vertical center with margin. Same 8000ms rationale as the swipe above
# (CheL-105 WU2).
- swipe:
    start: 7%,50%
    end: 7%,17%
    duration: 8000
- assertVisible:
    text: '.*Scenario second.*'
    below:
      text: '.*Scenario first.*'
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
- tapOn: Start run
- assertVisible:
    text: '.*Scenario second.*'
    below:
      text: '.*Scenario first.*'
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
- runFlow: helpers/discard-run.yaml
- runFlow: helpers/delete-checklist.yaml
