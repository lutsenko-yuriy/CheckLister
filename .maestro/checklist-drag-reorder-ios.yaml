appId: ${APP_ID}
name: Drag-to-reorder checklist items and use the order in a run
tags:
  - ios
---
- runFlow: helpers/create-checklist.yaml
- tapOn: New item
- inputText: Scenario third
- pressKey: Enter
# Initial order: first, second, third.
- assertVisible:
    text: '.*Scenario second.*'
    below:
      text: '.*Scenario first.*'
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
# Drag "first" downward past "second" and "third", landing in "third"'s slot.
# Expected order: second, third, first. react-native-reanimated-dnd's pan
# gesture uses activateAfterLongPress(200); too-fast a swipe moves too much
# before that timer fires and the drag never activates (Maestro still
# reports the swipe COMPLETED, but the app shows zero movement). CheL-98
# fixed a coordinate miss and landed on 12000ms as a safe duration; CheL-105
# WU2 re-probed with the coordinate fix in place and found 8000ms holds
# 10/10 while 4000ms fails 9/10 — see docs/SCENARIOS.md's "Verified
# CheL-105 WU2" section for the full probe data.
- swipe:
    start: 7%,35%
    end: 7%,69%
    duration: 8000
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
- assertVisible:
    text: '.*Scenario first.*'
    below:
      text: '.*Scenario third.*'
# Drag "first" (now at the bottom) upward back to the top, restoring the
# original order: first, second, third. CheL-98: the start point must land
# on the item's drag-handle testID — 48% silently missed it, so 50% (the
# handle's measured vertical center) is used instead. Same duration
# rationale as the swipe above.
- swipe:
    start: 7%,50%
    end: 7%,17%
    duration: 8000
- assertVisible:
    text: '.*Scenario second.*'
    below:
      text: '.*Scenario first.*'
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
- tapOn: Start run
- assertVisible:
    text: '.*Scenario second.*'
    below:
      text: '.*Scenario first.*'
- assertVisible:
    text: '.*Scenario third.*'
    below:
      text: '.*Scenario second.*'
- runFlow: helpers/discard-run.yaml
- runFlow: helpers/delete-checklist.yaml
